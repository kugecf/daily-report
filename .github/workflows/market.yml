name: Price Drop Monitor

on:
  schedule:
    # Every 2 hours during US market hours (9:30-16:00 ET = 13:30-20:00 UTC)
    # Run 14:00, 16:00, 18:00, 20:00 UTC (22:00, 00:00, 02:00, 04:00 Beijing)
    - cron: '0 14,16,18,20 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run price monitor
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: |
          python market_report.py

      - name: Commit state changes
        run: |
          git config user.name "Daily Report Bot"
          git config user.email "bot@daily-report"
          git add alerts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update price monitor state"
          git push

name: Price Drop Monitor

on:
  schedule:
    # Once daily at US market close (16:00 ET = 20:00 UTC)
    # Mon-Fri only, avoids weekends and holidays via workflow_dispatch
    - cron: '0 20 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run price monitor
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
        run: |
          python market_report.py

      - name: Commit state changes
        run: |
          git config user.name "Daily Report Bot"
          git config user.email "bot@daily-report"
          git add alerts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: update price monitor state"
          git push
